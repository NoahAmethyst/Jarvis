apiVersion: v1
kind: Namespace
metadata:
  name: default

---
# ── 非敏感配置 ────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: default
data:
  HTTP_PORT: "8080"
  GRPC_PORT: "9090"
  LLM_CONFIG_PATH: "llm.yaml"
  DEEPSEEK_BASE_URL: "https://api.deepseek.com"
  SILICONFLOW_BASE_URL: "https://api.siliconflow.cn/v1"
  EMBED_MODEL: "siliconflow/Qwen/Qwen3-Embedding-8B"
  VECTOR_SIZE: "4096"
  QDRANT_URL: "http://qdrant.deploy-env.svc.cluster.local:6333"
  REFLECTION_SCORE_THRESHOLD: "0.7"
  REFLECTION_MAX_RETRIES: "3"
  KNOWLEDGE_MIN_LENGTH: "200"
  AGENTS_DIR: ".agents/skills"
  AGENT_DISPATCH_THRESHOLD: "0.6"

---
# ── Jarvis 应用 ────────────────────────────────────────────────────────────────
# Secret `jarvis-secrets` is created out of band and is never committed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jarvis
  template:
    metadata:
      labels:
        app: jarvis
    spec:
      imagePullSecrets:
        - name: aliyun-docker-register
      containers:
        - name: jarvis
          image: registry.cn-hangzhou.aliyuncs.com/lexmargin/jarvis:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: jarvis-config
            - secretRef:
                name: jarvis-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 1m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: jarvis
  namespace: default
spec:
  selector:
    app: jarvis
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
    - name: grpc
      port: 9090
      targetPort: 9090
      nodePort: 30094
  type: NodePort
