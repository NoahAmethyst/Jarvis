syntax = "proto3";
package proto;

// Wire-compatible subset of the deployed QQBotService schema, verified via
// server reflection. Unused response fields are retained as unknown fields.
message SendMsgReq {
  string content = 1;
  int64 chat = 2;
  bool group = 3;
}
message Resp {
  string message = 1;
}
service QQBotService {
  rpc SendMsg(SendMsgReq) returns (Resp);
}
