name: Docker Image CI

on:
  push:
    branches: [ "master" ]
    paths:
      - "jarvis/**"
      - ".agents/skills/**/SKILL.md"
      - ".agents/skills/**/agent.json"
      - ".agents/skills/**/agent.yaml"
      - ".agents/skills/**/agents/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "llm.yaml"
  pull_request:
    branches: [ "master" ]
    paths:
      - "jarvis/**"
      - ".agents/skills/**/SKILL.md"
      - ".agents/skills/**/agent.json"
      - ".agents/skills/**/agent.yaml"
      - ".agents/skills/**/agents/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
      - "pyproject.toml"
      - "llm.yaml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Aliyun
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          # Aliyun rejects the OCI empty config used by provenance attestations.
          provenance: false
          cache-from: type=gha,scope=jarvis-linux-amd64
          cache-to: type=gha,mode=max,scope=jarvis-linux-amd64,ignore-error=true
          push: ${{ github.event_name == 'push' }}
          tags: |
            registry.cn-hangzhou.aliyuncs.com/lexmargin/jarvis:latest
